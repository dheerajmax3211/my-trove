spring.application.name=platform-service
server.port=8089

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/platform}
spring.datasource.username=${DB_USER:platform}
spring.datasource.password=${DB_PASSWORD:platform}

# platform = plain tables (read by the jOOQ generator); platform_ext = TimescaleDB hypertable and aggregates (V100+)
spring.flyway.locations=classpath:db/migration/platform,classpath:db/migration/platform_ext
spring.flyway.schemas=platform
spring.flyway.default-schema=platform
# Plain migrations (V1..) and extension migrations (V100+) share one history table; a plain migration added after an
# extension one was applied is "out of order" on an existing database, so allow it.
spring.flyway.out-of-order=true

spring.jooq.sql-dialect=postgres

# Verifies platform tokens issued by the auth service (see app.security.mode)
app.security.mode=${APP_SECURITY_MODE:firebase}
app.firebase.project-id=${FIREBASE_PROJECT_ID:}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app.internal.api-key=${APP_INTERNAL_API_KEY:}

management.endpoints.web.exposure.include=health,info

# Usage pipeline: the gateway publishes one event per proxied request; offsets are committed only after the insert.
app.usage.topic=platform.usage.v1
app.usage.dlq-topic=platform.usage.v1.dlq
spring.kafka.consumer.group-id=platform-service-usage
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

# Webhooks (W4): domain events in, signed deliveries out. The worker is paused in tests, which call deliverDue() directly.
app.webhooks.domain-topic=platform.domain.events.v1
app.webhooks.domain-dlq-topic=platform.domain.events.v1.dlq
app.webhooks.worker-enabled=true
app.webhooks.worker-interval=PT2S
