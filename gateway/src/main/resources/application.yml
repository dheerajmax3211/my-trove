spring:
  application:
    name: gateway
  reactor:
    # Carries the trace context across reactive hops so the traceId reaches the log MDC.
    context-propagation: auto
  cloud:
    # Spring Cloud 2026.0.0 declares Boot 4.2.x as its supported line and refuses to start on the repo's Boot 4.1.2.
    # The artifacts do run on 4.1.2 (covered by this module's tests); re-enable once the repo moves to Boot 4.2.
    compatibility-verifier:
      enabled: false
server:
  port: 8080
# Actuator is served on a private management port (default: main port + 1000), never on the public one.
management:
  server:
    port: ${MANAGEMENT_PORT:9080}
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
logging:
  pattern:
    correlation: "[${spring.application.name:-},%X{traceId:-},%X{spanId:-}]"

gateway:
  # Base URIs default to http://localhost:<port> (auth 8081, shared 8082, waiting-on 8083, consent 8084,
  # home-pulse 8085, ask-your-life 8086, digital-legacy 8087, family-treasury 8088, platform 8089, mcp 8090).
  # Override with gateway.services.<name>.uri, e.g. GATEWAY_SERVICES_AUTH_URI.
  #
  # Route policy: product routes require products:use, mcp requires mcp:use, auth/shared/platform need only a valid token. Override with
  # gateway.routes.<name>.required-permission (empty string = none).

  # Requests the downstream service authenticates with its own credential. They are forwarded untouched, with no
  # exchange. Verified against each service's SecurityConfig / controllers; everything else needs a platform token.
  passthrough:
    # home-pulse: device ingestion, Authorization: Bearer hpd_... checked by DeviceTokenFilter (chain order 1).
    - service: home-pulse
      path: /v1/ingest/**
      description: device ingestion token (hpd_...)
    # waiting-on: inbound email provider webhook, X-Webhook-Secret checked by WebhookSecretFilter (chain order 1).
    - service: waiting-on
      methods: [POST]
      path: /v1/webhooks/**
      description: shared secret header X-Webhook-Secret
    # consent: OAuth token endpoints (client credentials in the request) and the public JWKS.
    - service: consent
      path: /v1/oauth/**
      principal-type: CONSENT_CLIENT
      description: OAuth client authentication at the token, introspect and revoke endpoints
    - service: consent
      path: /.well-known/**
      description: public JWKS of the consent token issuer
    # consent: data and request endpoints called by third-party clients with tokens consent itself issued.
    - service: consent
      path: /v1/gateway/**
      principal-type: CONSENT_CLIENT
      description: consent gateway tokens (TOKEN_ACCESS, TOKEN_CLIENT) issued by consent
    # shared: signed, expiring download links; the signed token is the authorization.
    - service: shared
      methods: [GET]
      path: /v1/files/download
      description: signed download link
    # digital-legacy: trustees are not platform users; they present a trustee token (or accept an invitation).
    - service: digital-legacy
      path: /v1/legacy/trustee/**
      description: trustee portal token / invitation acceptance
    # platform: the OpenAPI document describes the API and holds no secrets; developers read it without a key.
    - service: platform
      methods: [GET]
      path: /v3/api-docs
      description: public OpenAPI document of the platform service
    # auth: the exchange takes the identity provider's token itself, and the JWKS is public.
    - service: auth
      methods: [POST]
      path: /v1/token/exchange
      description: takes the Firebase ID token directly
    - service: auth
      methods: [GET]
      path: /.well-known/jwks.json
      description: public platform JWKS
  # API keys (pk_...): only the routes below are open to a key, each needs the permission it names (the scope
  # catalogue in platform-service maps scopes to these permissions). Every other route is refused for keys.
  api-key-routes:
    - service: platform
      methods: [GET]
      path: /v1/usage/me
      permission: usage:read:self
    # mcp-server: MCP Streamable HTTP (JSON-RPC over POST). GET (server-sent stream) is answered 405 by the server.
    # Tools that read personal data also need products:use, which mcp-server checks per tool.
    - service: mcp
      methods: [POST]
      path: /mcp
      permission: mcp:use
