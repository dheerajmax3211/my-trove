spring.application.name=mcp-server
server.port=8090

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/platform}
spring.datasource.username=${DB_USER:platform}
spring.datasource.password=${DB_PASSWORD:platform}

# mcp/ is read by the jOOQ generator; mcp_ext/ holds the plpgsql append-only trigger it must not parse.
spring.flyway.locations=classpath:db/migration/mcp,classpath:db/migration/mcp_ext
spring.flyway.schemas=mcp
spring.flyway.default-schema=mcp
# Plain migrations (V1..) and extension migrations (V100+) share one history table; allow a later plain one.
spring.flyway.out-of-order=true

spring.jooq.sql-dialect=postgres

# This service only makes sense with platform tokens: tools and the endpoint check the permissions they carry.
app.security.mode=${APP_SECURITY_MODE:platform}
app.firebase.project-id=${FIREBASE_PROJECT_ID:}

# Product services the tools read from, with the caller's own token (never a credential of this service).
app.mcp.services.waiting-on=${WAITING_ON_URL:http://localhost:8083}
app.mcp.services.ask-your-life=${ASK_YOUR_LIFE_URL:http://localhost:8086}
app.mcp.services.home-pulse=${HOME_PULSE_URL:http://localhost:8085}
app.mcp.services.family-treasury=${FAMILY_TREASURY_URL:http://localhost:8088}
app.mcp.timeout=${MCP_DOWNSTREAM_TIMEOUT:PT5S}

# Actuator is served on a private management port (default: main port + 1000), never on the public one.
management.server.port=${MANAGEMENT_PORT:9090}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoints.web.base-path=/actuator
management.tracing.sampling.probability=${TRACING_SAMPLING:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
logging.pattern.correlation=[${spring.application.name:-},%X{traceId:-},%X{spanId:-}]
