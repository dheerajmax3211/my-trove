spring.application.name=auth-service
server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/platform}
spring.datasource.username=${DB_USER:platform}
spring.datasource.password=${DB_PASSWORD:platform}

# auth_ext holds the append-only audit trigger and other statements the jOOQ generator must not parse (>= V100)
spring.flyway.locations=classpath:db/migration/auth,classpath:db/migration/auth_ext
spring.flyway.schemas=auth
spring.flyway.default-schema=auth
# Plain migrations (V1..) and extension migrations (V100+) share one history table; a plain migration added after an
# extension one was applied is "out of order" on an existing database, so allow it.
spring.flyway.out-of-order=true

spring.jooq.sql-dialect=postgres

# Firebase project whose ID tokens this service accepts (required)
app.firebase.project-id=${FIREBASE_PROJECT_ID:}
app.firebase.jwk-set-uri=https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com
# Comma-separated emails that become OWNER on sign-in (email must be verified)
app.auth.bootstrap-admin-emails=${BOOTSTRAP_ADMIN_EMAILS:}

# --- platform tokens (design 5.3) ---
# `iss` of the platform tokens this service issues; services verify against it and the JWKS at /.well-known/jwks.json
app.platform.issuer=http://localhost:8081
# REQUIRED, no default: app.platform.key-encryption-key = env APP_PLATFORM_KEY_ENCRYPTION_KEY, base64 of 32 random
# bytes (openssl rand -base64 32). The signing keys are encrypted with it at rest; the service refuses to start without it.
app.platform.key-rotation-interval=P30D

management.endpoints.web.exposure.include=health,info
