spring.application.name=home-pulse
server.port=8085

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/platform}
spring.datasource.username=${DB_USER:platform}
spring.datasource.password=${DB_PASSWORD:platform}

# Two Flyway locations sharing one history table: parseable plain tables (V1..) and TimescaleDB-specific
# statements (V100+: hypertable, continuous aggregates, compression/retention policies).
spring.flyway.locations=classpath:db/migration/home_pulse,classpath:db/migration/home_pulse_ext
spring.flyway.schemas=home_pulse
spring.flyway.default-schema=home_pulse
# Plain migrations (V1..) and extension migrations (V100+) share one history table; a plain migration added after an
# extension one was applied is "out of order" on an existing database, so allow it.
spring.flyway.out-of-order=true

spring.jooq.sql-dialect=postgres

# Firebase project whose ID tokens this service accepts for the owner APIs (required at runtime; tests supply a stub decoder)
app.firebase.project-id=${FIREBASE_PROJECT_ID:}

# MQTT ingestion adapter (Eclipse Paho). OFF by default: the HTTP ingest endpoint needs no broker.
app.mqtt.enabled=${MQTT_ENABLED:false}
app.mqtt.broker-uri=${MQTT_BROKER_URI:tcp://localhost:1883}
app.mqtt.client-id=${MQTT_CLIENT_ID:home-pulse}
app.mqtt.username=${MQTT_USERNAME:}
app.mqtt.password=${MQTT_PASSWORD:}
app.mqtt.topic-filter=${MQTT_TOPIC_FILTER:homepulse/+/reading}
app.mqtt.qos=1

# Anomaly evaluation job
app.evaluation.enabled=${EVALUATION_ENABLED:true}
app.evaluation.interval=${EVALUATION_INTERVAL:PT5M}
app.evaluation.learn-days=${LEARN_DAYS:7}
app.evaluation.resolve-after-clear-runs=3

# Ingestion limits
app.ingest.max-batch-size=1000
app.ingest.max-future-skew=PT5M
app.ingest.max-age=P30D

spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health,info
