spring.application.name=digital-legacy
server.port=8087

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/platform}
spring.datasource.username=${DB_USER:platform}
spring.datasource.password=${DB_PASSWORD:platform}

# legacy_ext holds plpgsql triggers that jOOQ's DDL parser cannot read; versions >= 100, same history table
spring.flyway.locations=classpath:db/migration/legacy,classpath:db/migration/legacy_ext
spring.flyway.schemas=legacy
spring.flyway.default-schema=legacy
# Plain migrations (V1..) and extension migrations (V100+) share one history table; a plain migration added after an
# extension one was applied is "out of order" on an existing database, so allow it.
spring.flyway.out-of-order=true

spring.jooq.sql-dialect=postgres

# Firebase project whose ID tokens this service accepts (required at runtime; tests supply a stub decoder)
app.firebase.project-id=${FIREBASE_PROJECT_ID:}

management.endpoints.web.exposure.include=health,info

# --- digital-legacy settings (all overridable by env) ---
legacy.max-ciphertext-bytes=${LEGACY_MAX_CIPHERTEXT_BYTES:1048576}
legacy.max-trustees=10
# Where the trustee accept link points (the trustee portal). The token travels in the URL fragment only.
legacy.trustee-portal-url=${LEGACY_TRUSTEE_PORTAL_URL:http://localhost:5190}
legacy.invite-ttl=14d
legacy.late-tolerance=1h
legacy.limits.min-interval=1h
legacy.limits.max-interval=366d
legacy.limits.min-grace=0s
legacy.limits.max-grace=90d
legacy.limits.min-cool-off=1h
legacy.limits.max-cool-off=30d
legacy.limits.max-escalation=90d
legacy.limits.max-pause=60d
legacy.limits.yearly-pause-budget=120d
legacy.scheduler.enabled=${LEGACY_SCHEDULER_ENABLED:true}
legacy.scheduler.fixed-delay=30s
legacy.scheduler.max-per-tick=200
legacy.notifications.max-attempts=5
legacy.notifications.retry-backoff=2m
logging.level.com.personalplatform.legacy=INFO
