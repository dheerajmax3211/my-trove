spring.application.name=shared-service
server.port=8082

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/platform}
spring.datasource.username=${DB_USER:platform}
spring.datasource.password=${DB_PASSWORD:platform}

# shared/ is read by the jOOQ generator; shared_ext/ holds plpgsql (audit immutability trigger) it must not parse.
spring.flyway.locations=classpath:db/migration/shared,classpath:db/migration/shared_ext
spring.flyway.schemas=shared
spring.flyway.default-schema=shared
# Plain migrations (V1..) and extension migrations (V100+) share one history table; a plain migration added after an
# extension one was applied is "out of order" on an existing database, so allow it.
spring.flyway.out-of-order=true

spring.jooq.sql-dialect=postgres

spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:10MB}

# Firebase project whose ID tokens this service accepts (required at runtime; tests supply a stub decoder)
app.firebase.project-id=${FIREBASE_PROJECT_ID:}

# Reminder scheduler / notification relay
app.scheduler.enabled=${SCHEDULER_ENABLED:true}
app.scheduler.poll-interval=${SCHEDULER_POLL_INTERVAL:PT5S}
app.scheduler.batch-size=${SCHEDULER_BATCH_SIZE:50}
app.scheduler.max-attempts=${NOTIFICATION_MAX_ATTEMPTS:5}
app.scheduler.base-backoff=${NOTIFICATION_BASE_BACKOFF:PT30S}
app.scheduler.max-backoff=${NOTIFICATION_MAX_BACKOFF:PT1H}
# "logging" enables the built-in log sender; anything else expects your own NotificationSender bean
app.notifications.sender=${NOTIFICATION_SENDER:logging}

# File storage (local filesystem blob store) and signed download links
app.files.local-root=${FILES_ROOT:./data/blobs}
app.files.token-secret=${FILE_TOKEN_SECRET:}
app.files.default-token-ttl=${FILE_TOKEN_TTL:PT10M}
app.files.max-token-ttl=PT1H

management.endpoints.web.exposure.include=health,info
