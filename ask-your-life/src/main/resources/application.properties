spring.application.name=ask-your-life
server.port=8086

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/platform}
spring.datasource.username=${DB_USER:platform}
spring.datasource.password=${DB_PASSWORD:platform}

# Two locations share one history table: plain-SQL tables (what jOOQ generates from) and the pgvector / RLS
# migrations (version >= 100) that jOOQ's parser cannot read.
spring.flyway.locations=classpath:db/migration/ask_life,classpath:db/migration/ask_life_ext
spring.flyway.schemas=ask_life
spring.flyway.default-schema=ask_life
# Plain migrations (V1..) and extension migrations (V100+) share one history table; a plain migration added after an
# extension one was applied is "out of order" on an existing database, so allow it.
spring.flyway.out-of-order=true

spring.jooq.sql-dialect=postgres

spring.jackson.default-property-inclusion=non_null

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Firebase project whose ID tokens this service accepts (required at runtime; tests supply a stub decoder)
app.firebase.project-id=${FIREBASE_PROJECT_ID:}

# --- Ask Your Life ---
# Embedder: local deterministic hashing embedder by default; set a URL to use an OpenAI-style HTTP embeddings API.
app.embedder.dimension=384
app.embedder.http.url=${EMBEDDER_URL:}
app.embedder.http.model=${EMBEDDER_MODEL:}
app.embedder.http.api-key=${EMBEDDER_API_KEY:}
app.embedder.http.batch-size=${EMBEDDER_BATCH_SIZE:32}
# Ingestion worker / chunking
app.ingest.scheduler-enabled=${INGEST_SCHEDULER_ENABLED:true}
app.ingest.chunk-max-tokens=180
app.ingest.chunk-overlap-tokens=30
app.ingest.max-attempts=5
# RLS: every transaction runs SET LOCAL ROLE <this role>; blank if the datasource already logs in as a non-superuser
app.rls.role=${RLS_ROLE:ask_life_app}
# Retrieval
app.search.rrf-k=60

# Actuator is served on a private management port (default: main port + 1000), never on the public one.
management.server.port=${MANAGEMENT_PORT:9086}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoints.web.base-path=/actuator
management.tracing.sampling.probability=${TRACING_SAMPLING:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
logging.pattern.correlation=[${spring.application.name:-},%X{traceId:-},%X{spanId:-}]
