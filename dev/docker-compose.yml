# One dev database for every service. timescaledb-ha ships both TimescaleDB (home-pulse) and pgvector
# (ask-your-life), so a single instance runs all eight schemas. Same port and credentials as the root file;
# stop that one first.   docker compose -f dev/docker-compose.yml up -d
services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
    ports:
      - "5433:5432"
    volumes:
      - dev-pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 3s
      retries: 20
  # Temporal dev server (in-memory) for waiting-on's durable follow-ups. Web UI on http://localhost:8233.
  temporal:
    image: temporalio/temporal:latest
    command: server start-dev --ip 0.0.0.0
    ports:
      - "7233:7233"
      - "8233:8233"
  # Kafka (KRaft, single node) for the usage/metering pipeline. Host listener: localhost:9092.
  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
  # Mailpit catches every email the platform sends in dev (never a real inbox). SMTP localhost:1025; open
  # http://localhost:8025 to read them.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
  # Observability (opt-in): docker compose -f dev/docker-compose.yml --profile observability up -d
  # Prometheus http://localhost:9090, Jaeger UI http://localhost:16686, Grafana http://localhost:3000 (admin/admin).
  # Services run on the host; Prometheus reaches their management ports through host.docker.internal.
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  jaeger:
    image: jaegertracing/jaeger:2.23.0
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4318:4318"
  grafana:
    image: grafana/grafana:12.2.0
    profiles: ["observability"]
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - jaeger
volumes:
  dev-pgdata:
