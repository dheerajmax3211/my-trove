name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven, Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Tests start real Postgres, TimescaleDB and pgvector containers; Docker is preinstalled on the runner.
      # -Dfetch-model: fetch Ask Your Life's pinned embedding model (8 MB, checksum-verified) and require it, so the
      # model-quality tests run instead of being skipped.
      - run: ./mvnw -B -ntp verify -Dfetch-model
      # On failure, name each failing test in a public annotation (logs need a sign-in; annotations do not)...
      - name: Annotate failing tests
        if: failure()
        run: python3 .github/scripts/annotate-test-failures.py
      # ...and keep the surefire/failsafe reports so the exact failing test can be read from the run.
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui-common
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui-common/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui-common/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm -r build
