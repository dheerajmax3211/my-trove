<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A dead-man's switch for the things you leave behind. Everything is encrypted in your browser; the server never sees a secret."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E5C52'/%3E%3Cpath d='M16 7l7 3v6c0 4.5-3 7.6-7 9-4-1.4-7-4.5-7-9v-6z' fill='none' stroke='%23FFFDF8' stroke-width='2.4' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>Digital Legacy</title>
    <script>
      // Apply a saved explicit theme before first paint (avoids a light flash in dark mode).
      try {
        var t = localStorage.getItem('pp-theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
