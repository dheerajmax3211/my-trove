<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My-Trove: keep your paperwork in one place, share only what you choose</title>
    <meta
      name="description"
      content="My-Trove is six products for the paperwork of life on one platform: chase what you are owed, lend your data to apps, watch appliances, search your notes, plan a legacy and keep household books."
    />
    <meta name="theme-color" content="#0F1F1B" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="My-Trove" />
    <meta
      property="og:title"
      content="My-Trove: keep your paperwork in one place, share only what you choose"
    />
    <meta
      property="og:description"
      content="Six products for the paperwork of life on one platform, with you deciding who sees what. An open portfolio project."
    />
    <meta property="og:image" content="https://my-trove.example/og-image.png" />
    <meta
      property="og:image:alt"
      content="The My-Trove logo and the line: A vault you can lend from."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="My-Trove: keep your paperwork in one place, share only what you choose"
    />
    <meta
      name="twitter:description"
      content="Six products for the paperwork of life on one platform, with you deciding who sees what."
    />
    <meta name="twitter:image" content="https://my-trove.example/og-image.png" />
    <script>
      // Apply a saved explicit theme before first paint (avoids a light flash in dark mode).
      try {
        var t = localStorage.getItem('pp-theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>My-Trove needs JavaScript to show this site.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
