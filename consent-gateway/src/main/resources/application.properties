spring.application.name=consent-gateway
server.port=8084

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/platform}
spring.datasource.username=${DB_USER:platform}
spring.datasource.password=${DB_PASSWORD:platform}

# consent_ext holds the append-only trigger and other statements the jOOQ generator must not parse
spring.flyway.locations=classpath:db/migration/consent,classpath:db/migration/consent_ext
spring.flyway.schemas=consent
spring.flyway.default-schema=consent

spring.jooq.sql-dialect=postgres

# Firebase project whose ID tokens this service accepts (required at runtime; tests supply a stub decoder)
app.firebase.project-id=${FIREBASE_PROJECT_ID:}

# --- consent gateway ---
# Public issuer / audience of gateway-signed tokens
app.consent.issuer=${CONSENT_ISSUER:http://localhost:8084}
app.consent.audience=consent-gateway
app.consent.access-token-ttl=PT5M
app.consent.client-token-ttl=PT5M
app.consent.clock-skew=PT30S
app.consent.request-ttl=P7D
app.consent.max-grant-duration=P365D
app.consent.key-rotation-interval=P30D
# Base64 of 32 random bytes. REQUIRED; there is deliberately no default outside the `dev` profile.
app.consent.key-encryption-key=${CONSENT_KEY_ENCRYPTION_KEY:}

management.endpoints.web.exposure.include=health,info
