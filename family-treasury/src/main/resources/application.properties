spring.application.name=family-treasury
server.port=8088

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/platform}
spring.datasource.username=${DB_USER:platform}
spring.datasource.password=${DB_PASSWORD:platform}

# Two locations share one history table: parseable tables (jOOQ reads these) and plpgsql ledger invariants (>= V100).
spring.flyway.locations=classpath:db/migration/treasury,classpath:db/migration/treasury_ext
spring.flyway.schemas=treasury
spring.flyway.default-schema=treasury

spring.jooq.sql-dialect=postgres

# Firebase project whose ID tokens this service accepts (required at runtime; tests supply a stub decoder)
app.firebase.project-id=${FIREBASE_PROJECT_ID:}

# Background jobs (all safe to run on several instances: allowance claiming uses FOR UPDATE SKIP LOCKED)
treasury.scheduler.enabled=${TREASURY_SCHEDULER_ENABLED:true}
treasury.scheduler.allowance-delay=${TREASURY_ALLOWANCE_DELAY:PT5M}
treasury.scheduler.expiry-delay=${TREASURY_EXPIRY_DELAY:PT5M}
treasury.scheduler.reconciliation-delay=${TREASURY_RECONCILIATION_DELAY:PT1H}

management.endpoints.web.exposure.include=health,info
