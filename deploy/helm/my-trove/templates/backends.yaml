{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "trove.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ $svc.replicas }}
  {{- if and (eq $name "shared-service") $.Values.files.persistentVolumeClaim }}
  # A ReadWriteOnce claim cannot attach to a second pod on another node during a rolling update.
  strategy: { type: Recreate }
  {{- end }}
  selector:
    matchLabels: { app.kubernetes.io/name: {{ $name }} }
  template:
    metadata:
      labels:
        {{- include "trove.labels" $ | nindent 8 }}
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $svc.managementPort | quote }}
        prometheus.io/path: /actuator/prometheus
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: {{ $name }}
          image: {{ include "trove.image" (dict "root" $ "name" $svc.module) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: {{ $svc.port }} }
            - { name: management, containerPort: {{ $svc.managementPort }} }
            {{- if and (eq $name "waiting-on") $.Values.inboundEmail.enabled }}
            - { name: smtp, containerPort: {{ $.Values.inboundEmail.containerPort }} }
            {{- end }}
          env:
            {{- include "trove.backendEnv" (dict "root" $ "name" $name "svc" $svc) | nindent 12 }}
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: management }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: management }
            periodSeconds: 5
          resources: {{- toYaml $.Values.resources.backend | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- if eq $name "shared-service" }}
            - { name: files, mountPath: /data/blobs }
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if eq $name "shared-service" }}
        - name: files
          {{- if $.Values.files.persistentVolumeClaim }}
          persistentVolumeClaim: { claimName: {{ $.Values.files.persistentVolumeClaim }} }
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
---
# Only the public port is a Service port. The management port is reached pod-to-pod by the scraper, and the
# NetworkPolicy admits that only from the monitoring namespace.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "trove.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  selector: { app.kubernetes.io/name: {{ $name }} }
  ports:
    - { name: http, port: {{ $svc.port }}, targetPort: http }
{{- end }}
{{- if .Values.inboundEmail.enabled }}
---
# Waiting On's SMTP listener, separate from the HTTP Service so it can be a LoadBalancer without exposing HTTP.
apiVersion: v1
kind: Service
metadata:
  name: waiting-on-smtp
  labels:
    {{- include "trove.labels" . | nindent 4 }}
    app.kubernetes.io/name: waiting-on
  {{- with .Values.inboundEmail.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.inboundEmail.service.type }}
  {{- if and (ne .Values.inboundEmail.service.type "ClusterIP") .Values.inboundEmail.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.inboundEmail.service.externalTrafficPolicy }}
  {{- end }}
  selector: { app.kubernetes.io/name: waiting-on }
  ports:
    - { name: smtp, port: {{ .Values.inboundEmail.servicePort }}, targetPort: smtp }
{{- end }}
