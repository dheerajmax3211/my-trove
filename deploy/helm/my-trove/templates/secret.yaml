{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{- $required := list "DB_PASSWORD" "APP_INTERNAL_API_KEY" "APP_PLATFORM_KEY_ENCRYPTION_KEY" "CONSENT_KEY_ENCRYPTION_KEY" "FILE_TOKEN_SECRET" "INBOUND_WEBHOOK_SECRET" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels: {{- include "trove.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $required }}
  {{ . }}: {{ required (printf "secrets.values.%s is required when secrets.create=true" .) (index $.Values.secrets.values .) | quote }}
  {{- end }}
{{- end }}
