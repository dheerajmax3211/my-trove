{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "trove.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    # The gateway is the only public entrance to the backends.
    - host: {{ .Values.ingress.hosts.api }}
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: gateway, port: { name: http } } } }
    {{- if .Values.web.workspace.enabled }}
    - host: {{ .Values.ingress.hosts.app }}
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: workspace, port: { name: http } } } }
    {{- end }}
    {{- if .Values.web.site.enabled }}
    - host: {{ .Values.ingress.hosts.www }}
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: site, port: { name: http } } } }
    {{- end }}
{{- end }}
