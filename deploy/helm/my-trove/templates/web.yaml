{{- range $app, $cfg := .Values.web }}
{{- if $cfg.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $app }}
  labels:
    {{- include "trove.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $app }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ $cfg.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: {{ $app }} }
  template:
    metadata:
      labels:
        {{- include "trove.labels" $ | nindent 8 }}
        app.kubernetes.io/name: {{ $app }}
        app.kubernetes.io/component: web
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: {{ $app }}
          image: {{ include "trove.image" (dict "root" $ "name" $app) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          resources: {{- toYaml $.Values.resources.web | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $app }}
  labels:
    {{- include "trove.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $app }}
spec:
  selector: { app.kubernetes.io/name: {{ $app }} }
  ports:
    - { name: http, port: 80, targetPort: http }
{{- end }}
{{- end }}
