spring.application.name=waiting-on
server.port=8083

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/platform}
spring.datasource.username=${DB_USER:platform}
spring.datasource.password=${DB_PASSWORD:platform}

# waiting_on = tables (read by the jOOQ generator); waiting_on_ext = plpgsql triggers (append-only timeline)
spring.flyway.locations=classpath:db/migration/waiting_on,classpath:db/migration/waiting_on_ext
spring.flyway.schemas=waiting_on
spring.flyway.default-schema=waiting_on
# Plain migrations (V1..) and extension migrations (V100+) share one history table; a plain migration added after an
# extension one was applied is "out of order" on an existing database, so allow it.
spring.flyway.out-of-order=true

spring.jooq.sql-dialect=postgres

# Firebase project whose ID tokens this service accepts (required at runtime; tests supply a stub decoder)
app.firebase.project-id=${FIREBASE_PROJECT_ID:}

# Actuator is served on a private management port (default: main port + 1000), never on the public one.
management.server.port=${MANAGEMENT_PORT:9083}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoints.web.base-path=/actuator
management.tracing.sampling.probability=${TRACING_SAMPLING:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
logging.pattern.correlation=[${spring.application.name:-},%X{traceId:-},%X{spanId:-}]

# --- Temporal (durable follow-up workflows) ---
# false = no Temporal client/worker at all; items are stored but not followed up automatically
app.temporal.enabled=${TEMPORAL_ENABLED:true}
app.temporal.target=${TEMPORAL_TARGET:127.0.0.1:7233}
app.temporal.namespace=${TEMPORAL_NAMESPACE:default}
app.temporal.task-queue=${TEMPORAL_TASK_QUEUE:waiting-on-follow-up}
app.temporal.tls=${TEMPORAL_TLS:false}
app.temporal.connect-timeout=${TEMPORAL_CONNECT_TIMEOUT:10s}

# --- Inbound email webhook (shared-secret auth, NOT Firebase). Blank secret = webhook rejects everything ---
app.inbound.secret=${INBOUND_WEBHOOK_SECRET:}
app.inbound.reply-domain=${REPLY_DOMAIN:reply.waiting-on.local}

# --- Inbound SMTP listener for the reply addresses (receive-only, never a relay; off by default) ---
# Accepts mail only for waiting+<token>@<reply-domain> of an open item; everything else is refused at RCPT TO.
app.inbound.smtp.enabled=${INBOUND_SMTP_ENABLED:false}
app.inbound.smtp.port=${INBOUND_SMTP_PORT:2525}
app.inbound.smtp.bind-address=${INBOUND_SMTP_BIND_ADDRESS:127.0.0.1}
app.inbound.smtp.host-name=${INBOUND_SMTP_HOSTNAME:waiting-on}
app.inbound.smtp.max-message-size=${INBOUND_SMTP_MAX_MESSAGE_SIZE:512KB}
app.inbound.smtp.connection-timeout=${INBOUND_SMTP_CONNECTION_TIMEOUT:60s}
app.inbound.smtp.max-connections=${INBOUND_SMTP_MAX_CONNECTIONS:50}
app.inbound.smtp.max-concurrent-per-ip=${INBOUND_SMTP_MAX_CONCURRENT_PER_IP:3}
app.inbound.smtp.max-connections-per-ip-per-minute=${INBOUND_SMTP_MAX_CONNECTIONS_PER_IP_PER_MINUTE:30}
app.inbound.smtp.max-messages-per-ip-per-hour=${INBOUND_SMTP_MAX_MESSAGES_PER_IP_PER_HOUR:60}
app.inbound.smtp.max-messages-per-connection=${INBOUND_SMTP_MAX_MESSAGES_PER_CONNECTION:5}
app.inbound.smtp.max-refused-recipients-per-connection=${INBOUND_SMTP_MAX_REFUSED_RECIPIENTS_PER_CONNECTION:3}
